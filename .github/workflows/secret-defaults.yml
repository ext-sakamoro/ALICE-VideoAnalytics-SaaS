name: Secret defaults

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-defaults:
    name: no literal default for a secret
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: python3 scripts/secret_default_check.py

  gateway-startup:
    name: the gateway refuses to start without a usable JWT_SECRET
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (branch, default toolchain stable)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: services/api-gateway
      - name: startup test (a run that executes no test fails)
        working-directory: services/api-gateway
        run: |
          out=$(cargo test --test startup 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          passed=$(awk '/^test result:/ {n += $4} END {print n + 0}' <<<"$out")
          [ "$passed" -gt 0 ] || { echo "::error::no test ran"; exit 1; }
